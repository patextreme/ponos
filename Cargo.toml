[workspace]
resolver = "3"
members = ["crates/*"]

# Version pins live here once; member crates inherit via
# `dep = { workspace = true }`. Feature sets are carried over verbatim
# from the pre-split single-crate manifest so the resolved build graph
# (and Cargo.lock) does not shift.
[workspace.dependencies]
agent-client-protocol = { version = "1.3", features = ["unstable_end_turn_token_usage"] }
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
mlua = { version = "0.12", features = ["luau", "async", "serialize"] }
# Pure-Rust Luau parser (AST walk for `ponos check`'s static lints and the
# `run` pre-flight; no execution, no serde needed). `luau` feature tracks
# Luau syntax, matching the luau0-src revision mlua builds on.
full-moon = { package = "full_moon", version = "2.2", features = ["luau"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
async-process = "2"
# MCP server+client used by the typed-results bridge (`ponos __bridge`)
# and by mock-agent's MCP client. IO + child-process transports only: no
# HTTP, no auth, no client-side SSE.
rmcp = { version = "3", features = ["client", "transport-io", "transport-child-process"] }
# JSON Schema validation for typed results. Default features disabled:
# resolve-http/resolve-file would reintroduce network/file access — remote
# $refs must fail at compile time so runs stay offline.
jsonschema = { version = "0.50", default-features = false }
# Local wall-clock HH:MM:SS for rendered log lines. Default features off:
# no bundled IANA tzdb (tz-system reads the system zone via
# /etc/localtime / TZ), pure Rust, wrapped behind one helper.
jiff = { version = "0.2", default-features = false, features = ["tz-system"] }
tempfile = "3"

# Baseline only (empty today): lint policy tightening — deny-by-default
# sets, the dependency-direction floor — is change ③ (hexagonal-polish).
# Member crates inherit via `[lints] workspace = true` so future
# tightening lands here once, for everyone.
# Lint policy (change ③ hexagonal-polish, design D2): every member
# inherits this table; tightening lands here once, for everyone.
#
# Adopted: rustc invariant lints that fire zero times on the pin
# (documentation of floor, not churn) plus the mechanical clippy set
# whose fixups cargo/clippy applies behavior-neutrally. Deliberate
# non-adoptions and their reasons are recorded in the change's
# design.md D2.
[workspace.lints]
rust.unsafe_op_in_unsafe_fn = "warn"
rust.rust_2018_idioms = "warn"
rust.elided_lifetimes_in_paths = "warn"
rust.missing_abi = "warn"
clippy.redundant_clone = "warn"
clippy.assigning_clones = "warn"
clippy.map_unwrap_or = "warn"
clippy.redundant_closure_for_method_calls = "warn"
clippy.semicolon_if_nothing_returned = "warn"
clippy.uninlined_format_args = "warn"
clippy.unnecessary_join = "warn"
clippy.unnecessary_debug_formatting = "warn"
clippy.enum_glob_use = "warn"
clippy.needless_continue = "warn"
clippy.if_not_else = "warn"
clippy.bool_to_int_with_if = "warn"
